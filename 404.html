<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Jess Holding</title>
<script>
/* Redirige les anciennes adresses (ex. /voyages-services/colis) vers le routeur du site */
var p = location.pathname, base = '/';
if (location.hostname.endsWith('github.io')) { base = '/' + p.split('/')[1] + '/'; p = p.slice(base.length - 1); }
location.replace(base + '#' + (p.replace(/\.html$/, '').replace(/\/+$/, '') || '/'));
</script></head><body></body></html>
